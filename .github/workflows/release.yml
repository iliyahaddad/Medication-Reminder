name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode keystore (optional)
        if: ${{ env.KS_B64 != '' }}
        env:
          KS_B64: ${{ secrets.MEDREMINDER_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          MEDREMINDER_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          MEDREMINDER_KEYSTORE_PASSWORD: ${{ secrets.MEDREMINDER_KEYSTORE_PASSWORD }}
          MEDREMINDER_KEY_ALIAS: ${{ secrets.MEDREMINDER_KEY_ALIAS }}
          MEDREMINDER_KEY_PASSWORD: ${{ secrets.MEDREMINDER_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
